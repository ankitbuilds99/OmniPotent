# DevOps Copilot — full local development stack
#
# Run: docker compose up -d
# Access: http://localhost:8000 — the image bakes in the built SPA and FastAPI
# serves it at /, so there is no separate frontend container here. For the Vite
# dev server with hot reload, run `npm run dev` in frontend/ (http://localhost:5173).
#
# Optional services for production-like setup:
#   docker compose --profile monitoring up -d

services:
  # Main API service (frontend + backend in one image)
  copilot:
    build: .
    ports:
      - "8000:8000"
    environment:
      # --- environment / security ---
      COPILOT_ENV: ${COPILOT_ENV:-development}
      COPILOT_API_TOKEN: ${COPILOT_API_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      COPILOT_RATE_LIMIT_PER_MIN: ${COPILOT_RATE_LIMIT_PER_MIN:-120}
      COPILOT_MAX_SESSIONS: ${COPILOT_MAX_SESSIONS:-50}
      # --- database ---
      # The keys handed to the container MUST carry the COPILOT_ prefix: Settings
      # is extra="ignore", so before this the bare DATABASE_URL/REDIS_URL were
      # silently dropped and the app fell back to SQLite and an in-process rate
      # limiter while postgres and redis idled beside it. (The app now also
      # accepts the bare names managed platforms inject, but be explicit here.)
      # The ${DATABASE_URL:-...} on the right is the HOST-side override — docker
      # compose interpolation, not what the app reads — and is the same name the
      # worker service below interpolates, so one host export moves both.
      COPILOT_DATABASE_URL: ${DATABASE_URL:-postgresql://omnipotent:omnipotent@postgres:5432/omnipotent}
      COPILOT_REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # --- LLM provider + keys ---
      COPILOT_PROVIDER: ${COPILOT_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # --- data sources ---
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      TARGET_REPO_PATH: ./sample_repo
      LOGS_DATA_PATH: ./app/mcp/servers/logs_metrics/sample_data
      # --- agent + state ---
      COPILOT_MAX_ITERATIONS: ${COPILOT_MAX_ITERATIONS:-8}
      # One state directory for every local store (SQLite DBs, checkpoints,
      # vectors); it must match the volume mount below and the Dockerfile.
      COPILOT_STATE_DIR: /app/data
      COPILOT_CHECKPOINT_DB: /app/data/copilot_checkpoints.sqlite
      COPILOT_AUTO_INVESTIGATE: ${COPILOT_AUTO_INVESTIGATE:-true}
      # --- auth ---
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    volumes:
      - copilot_state:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /healthz is the API's liveness route. /health is not a route at all: the
      # SPA catch-all answers it with index.html, so the container stayed
      # "healthy" no matter what the API was doing.
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Dramatiq worker — drains the background task queues off the request path.
  #
  # Same image as the API, different command. It consumes every queue, but only two
  # actors do useful work from a separate process today: send_notification and
  # sync_usage_to_stripe (outbound HTTP built from env + arguments, retried with
  # backoff). The rest need state that lives in the API process — app/tasks/worker.py
  # documents which and why. Note this is a SECOND queue system: the API also runs
  # app/jobqueue.py in-process for investigations, which is the one with a result path.
  #
  # There is deliberately no scheduler service. Its two jobs were removed (neither
  # could work from a scheduler process), so `--mode scheduler` now exits 1 rather
  # than idling; a service here would just crash-loop.
  worker:
    build: .
    command: ["python", "-m", "app.tasks.worker", "--mode", "worker"]
    environment:
      COPILOT_ENV: ${COPILOT_ENV:-development}
      # The broker. Dramatiq reads this directly (app/tasks/broker.py); without it
      # the worker falls back to a stub broker and silently processes nothing.
      COPILOT_REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      COPILOT_DATABASE_URL: ${DATABASE_URL:-postgresql://omnipotent:omnipotent@postgres:5432/omnipotent}
      # --- outbound targets for the two deployable actors ---
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_CHANNEL: ${SLACK_CHANNEL:-}
      PAGERDUTY_API_TOKEN: ${PAGERDUTY_API_TOKEN:-}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      # --- LLM keys, for run_investigation once its results are shareable ---
      COPILOT_PROVIDER: ${COPILOT_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COPILOT_STATE_DIR: /app/data
    volumes:
      - copilot_state:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: omnipotent
      POSTGRES_PASSWORD: omnipotent
      POSTGRES_DB: omnipotent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnipotent"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis for caching, sessions, and rate limiting
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Prometheus for metrics (optional, use --profile monitoring)
  prometheus:
    image: prom/prometheus:v2.47.0
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  # Grafana for dashboards (optional, use --profile monitoring)
  grafana:
    image: grafana/grafana:10.2.0
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # Jaeger for distributed tracing (optional, use --profile monitoring)
  jaeger:
    image: jaegertracing/all-in-one:1.50
    profiles: ["monitoring"]
    ports:
      - "16686:16686"  # UI
      - "6831:6831/udp"  # Thrift compact
      - "14268:14268"  # HTTP collector
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    restart: unless-stopped

volumes:
  copilot_state:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: omnipotent-network
