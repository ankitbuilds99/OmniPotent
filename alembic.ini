# Alembic configuration for DevOps Copilot database migrations
#
# Usage:
#   alembic upgrade head      # Apply all migrations
#   alembic revision --autogenerate -m "description"  # Create migration
#   alembic downgrade -1      # Rollback one migration
#   alembic history           # Show migration history

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Database URL - override with COPILOT_DATABASE_URL env var
# Default to SQLite for development
sqlalchemy.url = sqlite:///data/copilot.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
