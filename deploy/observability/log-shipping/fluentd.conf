# Fluentd Configuration for OmniPotent
# Collects application logs and ships to configured destinations
#
# Deploy as DaemonSet or Sidecar alongside the application.
# See deploy/observability/log-shipping/fluentd-daemonset.yaml for Kubernetes deployment.

# ============================================================================
# SOURCES - Collect logs from various inputs
# ============================================================================

# Collect container stdout/stderr logs (Kubernetes default log path)
<source>
  @type tail
  @id in_container_logs
  path /var/log/containers/omnipotent-*.log
  pos_file /var/log/fluentd-containers.pos
  tag kubernetes.*
  read_from_head true
  <parse>
    @type json
    time_key time
    time_format %Y-%m-%dT%H:%M:%S.%NZ
    keep_time_key true
  </parse>
</source>

# Collect application JSON logs from file (if mounted volume)
<source>
  @type tail
  @id in_app_logs
  path /app/logs/*.log
  pos_file /var/log/fluentd-app.pos
  tag omnipotent.app
  read_from_head true
  <parse>
    @type json
    time_key ts
    time_format %Y-%m-%d %H:%M:%S,%L
    keep_time_key true
  </parse>
</source>

# Forward protocol for direct log shipping from application
<source>
  @type forward
  @id in_forward
  port 24224
  bind 0.0.0.0
</source>

# ============================================================================
# FILTERS - Parse, transform, and enrich logs
# ============================================================================

# Extract Kubernetes metadata from container log paths
<filter kubernetes.**>
  @type kubernetes_metadata
  @id filter_kubernetes_metadata
  kubernetes_url "#{ENV['KUBERNETES_SERVICE_HOST']}:#{ENV['KUBERNETES_SERVICE_PORT']}"
  cache_size 1000
  watch true
  de_dot false
  annotation_match ["omnipotent.*"]
</filter>

# Parse JSON log messages within the "log" field
<filter kubernetes.**>
  @type parser
  @id filter_parser
  key_name log
  reserve_data true
  remove_key_name_field true
  <parse>
    @type multi_format
    <pattern>
      format json
      time_key ts
      time_format %Y-%m-%d %H:%M:%S,%L
    </pattern>
    <pattern>
      format none
    </pattern>
  </parse>
</filter>

# Enrich with omnipotent-specific fields
<filter omnipotent.**>
  @type record_transformer
  @id filter_enrich
  enable_ruby true
  <record>
    environment "#{ENV['COPILOT_ENV'] || 'development'}"
    service omnipotent
    version "#{ENV['APP_VERSION'] || 'unknown'}"
    host "#{Socket.gethostname}"
    # Extract request_id for correlation
    request_id ${record["request_id"] || "-"}
    # Normalize severity levels
    severity ${record["level"]&.downcase || "info"}
  </record>
</filter>

# Redact sensitive data patterns
<filter **>
  @type record_transformer
  @id filter_redact
  enable_ruby true
  <record>
    msg ${record["msg"]&.gsub(/Bearer [A-Za-z0-9\-_.~+\/]+=*/, "Bearer [REDACTED]")&.gsub(/dcp_[A-Za-z0-9]+/, "dcp_[REDACTED]")}
  </record>
</filter>

# ============================================================================
# OUTPUTS - Ship logs to configured destinations
# ============================================================================

# Primary: Elasticsearch / OpenSearch
<match omnipotent.**>
  @type elasticsearch
  @id out_elasticsearch
  host "#{ENV['ELASTICSEARCH_HOST'] || 'elasticsearch'}"
  port "#{ENV['ELASTICSEARCH_PORT'] || 9200}"
  scheme "#{ENV['ELASTICSEARCH_SCHEME'] || 'https'}"
  ssl_verify "#{ENV['ELASTICSEARCH_SSL_VERIFY'] || 'true'}"
  user "#{ENV['ELASTICSEARCH_USER']}"
  password "#{ENV['ELASTICSEARCH_PASSWORD']}"

  logstash_format true
  logstash_prefix omnipotent-logs
  logstash_dateformat %Y.%m.%d

  include_timestamp true
  time_key @timestamp

  type_name _doc
  include_tag_key true
  tag_key @log_name

  # Buffer configuration for reliability
  <buffer tag, time>
    @type file
    path /var/log/fluentd-buffers/elasticsearch.buffer
    flush_mode interval
    flush_interval 5s
    flush_thread_count 2
    chunk_limit_size 10M
    total_limit_size 1G
    overflow_action drop_oldest_chunk
    retry_max_interval 30s
    retry_forever true
  </buffer>
</match>

# Secondary: Datadog (if configured)
<match omnipotent.** kubernetes.**>
  @type datadog
  @id out_datadog
  api_key "#{ENV['DD_API_KEY']}"
  host "#{ENV['DD_LOGS_HOST'] || 'http-intake.logs.datadoghq.com'}"
  port "#{ENV['DD_LOGS_PORT'] || 443}"
  ssl true

  include_tag_key true
  tag_key source

  dd_source omnipotent
  dd_sourcecategory devops

  <buffer>
    @type memory
    flush_interval 5s
    chunk_limit_size 1M
  </buffer>

  # Only send if Datadog API key is configured
  @label @DATADOG
</match>

# Tertiary: Cloud-native logging
# AWS CloudWatch Logs
<match omnipotent.** kubernetes.**>
  @type cloudwatch_logs
  @id out_cloudwatch
  region "#{ENV['AWS_REGION'] || 'us-east-1'}"
  log_group_name "#{ENV['CLOUDWATCH_LOG_GROUP'] || '/omnipotent/app'}"
  log_stream_name_key kubernetes.pod_name
  auto_create_stream true

  <buffer>
    @type file
    path /var/log/fluentd-buffers/cloudwatch.buffer
    flush_interval 10s
    chunk_limit_size 5M
  </buffer>

  # Only send if AWS credentials are available
  @label @CLOUDWATCH
</match>

# GCP Cloud Logging
<match omnipotent.** kubernetes.**>
  @type google_cloud
  @id out_gcp_logging

  use_metadata_service true
  project "#{ENV['GCP_PROJECT']}"

  <buffer>
    @type file
    path /var/log/fluentd-buffers/gcp.buffer
    flush_interval 5s
    chunk_limit_size 5M
  </buffer>

  # Only send if running on GCP
  @label @GCP
</match>

# Fallback: stdout for debugging
<match **>
  @type stdout
  @id out_stdout
  <format>
    @type json
  </format>
</match>
