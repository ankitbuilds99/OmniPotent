# Database migration Job — runs `alembic upgrade head` from the application image.
#
# Wired into deploy/kubernetes/kustomization.yaml, so `kustomize build` /
# `kubectl apply -k` and ArgoCD both produce it. The ArgoCD hook annotations make
# it run *before* the Deployment rolls (sync-wave -1) and be recreated on every
# sync; under plain kubectl the annotations are inert and the Job simply runs once
# (re-applying after an image change fails on Job immutability — delete it first).
#
# The image must contain alembic.ini + migrations/ + the `migrations` extra; see
# the Dockerfile. The break-glass downgrade lives in migration-rollback-job.yaml
# and is deliberately NOT applied automatically.
apiVersion: batch/v1
kind: Job
metadata:
  name: omnipotent-migration
  labels:
    app.kubernetes.io/name: omnipotent-migration
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: omnipotent
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omnipotent-migration
        app.kubernetes.io/component: database
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: OnFailure
      # `omnipotent` is the only ServiceAccount this kustomization creates
      # (serviceaccount.yaml). Naming a missing one makes the ServiceAccount
      # admission controller reject the pod outright, so the Job never starts.
      serviceAccountName: omnipotent
      # UID 10001 is the `appuser` the Dockerfile creates and chowns /app to; with
      # readOnlyRootFilesystem the container cannot fix up ownership at runtime.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001

      initContainers:
        - name: wait-for-db
          image: postgres:15-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # Host/port/user are derived from the one connection string the app
              # itself uses. A previous version read them from three keys of a
              # Secret named `omnipotent-db-credentials` that this kustomization
              # never creates, so the pod died in CreateContainerConfigError
              # before the migration container was ever scheduled.
              case "$COPILOT_DATABASE_URL" in
                postgres://*|postgresql://*) ;;
                *)
                  echo "COPILOT_DATABASE_URL is not a Postgres URL; nothing to wait for."
                  exit 0
                  ;;
              esac
              authority=${COPILOT_DATABASE_URL#*://}
              authority=${authority%%\?*}
              userinfo=${authority%%@*}
              hostport=${authority#*@}
              hostport=${hostport%%/*}
              DB_USER=${userinfo%%:*}
              DB_HOST=${hostport%%:*}
              case "$hostport" in
                *:*) DB_PORT=${hostport##*:} ;;
                *)   DB_PORT=5432 ;;
              esac
              echo "Waiting for ${DB_HOST}:${DB_PORT} (user ${DB_USER}) to accept connections..."
              until pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER"; do
                echo "Database not ready, waiting..."
                sleep 2
              done
              echo "Database is ready"
          env:
            - name: COPILOT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: omnipotent-secrets
                  key: COPILOT_DATABASE_URL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi

      containers:
        - name: migrate
          # Rewritten by the `images:` entry in deploy/kubernetes/kustomization.yaml.
          image: ghcr.io/ankit25bcs10610/omnipotent:latest
          imagePullPolicy: Always
          workingDir: /app
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Current migration state:"
              alembic current || echo "No migrations applied yet"

              echo "Applying migrations..."
              alembic upgrade head

              echo "New migration state:"
              alembic current
          env:
            # migrations/env.py reads COPILOT_DATABASE_URL first, then DATABASE_URL.
            # Same key the Deployment gets via `envFrom: secretRef` — the schema is
            # migrated in exactly the database the app then talks to.
            - name: COPILOT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: omnipotent-secrets
                  key: COPILOT_DATABASE_URL
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

      volumes:
        - name: tmp
          emptyDir: {}
