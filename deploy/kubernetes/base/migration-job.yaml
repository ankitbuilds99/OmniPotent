# Database Migration Job Template
# Used for manual/scheduled migrations and pre-deployment hooks
apiVersion: batch/v1
kind: Job
metadata:
  name: omnipotent-migration
  labels:
    app.kubernetes.io/name: omnipotent-migration
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: omnipotent
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omnipotent-migration
        app.kubernetes.io/component: database
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: omnipotent-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001

      initContainers:
        - name: wait-for-db
          image: postgres:15-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for database to be ready..."
              until pg_isready -h $DB_HOST -p $DB_PORT -U $DB_USER; do
                echo "Database not ready, waiting..."
                sleep 2
              done
              echo "Database is ready"
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: omnipotent-db-credentials
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: omnipotent-db-credentials
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: omnipotent-db-credentials
                  key: username
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi

      containers:
        - name: migrate
          image: omnipotent-api:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Starting database migration..."
              echo "Current migration state:"
              alembic current || echo "No migrations applied yet"

              echo "Applying migrations..."
              alembic upgrade head

              echo "Migration completed successfully"
              echo "New migration state:"
              alembic current
          env:
            # migrations/env.py reads COPILOT_DATABASE_URL specifically. Injected
            # as the bare DATABASE_URL it fell through to alembic.ini's
            # sqlite:///data/copilot.db and "migrated" a throwaway file inside the
            # container while reporting success. Same for the two jobs below.
            - name: COPILOT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: omnipotent-db-credentials
                  key: url
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

      volumes:
        - name: tmp
          emptyDir: {}
---
# Pre-sync hook for ArgoCD
apiVersion: batch/v1
kind: Job
metadata:
  name: omnipotent-migration-presync
  labels:
    app.kubernetes.io/name: omnipotent-migration
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: omnipotent
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omnipotent-migration
        app.kubernetes.io/component: database
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: omnipotent-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001

      initContainers:
        - name: wait-for-db
          image: postgres:15-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h $DB_HOST -p $DB_PORT -U $DB_USER; do
                sleep 2
              done
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: omnipotent-db-credentials
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: omnipotent-db-credentials
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: omnipotent-db-credentials
                  key: username
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi

      containers:
        - name: migrate
          image: omnipotent-api:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Running pre-sync migration check..."

              # Check current state
              CURRENT=$(alembic current 2>/dev/null | head -1 || echo "none")
              HEAD=$(alembic heads 2>/dev/null | head -1)

              echo "Current: $CURRENT"
              echo "Target: $HEAD"

              if [ "$CURRENT" = "$HEAD" ]; then
                echo "No migrations needed"
                exit 0
              fi

              echo "Applying migrations..."
              alembic upgrade head

              echo "Pre-sync migration completed"
          env:
            - name: COPILOT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: omnipotent-db-credentials
                  key: url
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

      volumes:
        - name: tmp
          emptyDir: {}
---
# Rollback job template
apiVersion: batch/v1
kind: Job
metadata:
  name: omnipotent-migration-rollback
  labels:
    app.kubernetes.io/name: omnipotent-migration-rollback
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: omnipotent
  annotations:
    argocd.argoproj.io/hook: SyncFail
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 7200
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omnipotent-migration-rollback
        app.kubernetes.io/component: database
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      serviceAccountName: omnipotent-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001

      containers:
        - name: rollback
          image: omnipotent-api:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "SYNC FAILED - Attempting migration rollback..."

              CURRENT=$(alembic current 2>/dev/null | head -1 || echo "none")
              echo "Current migration: $CURRENT"

              # Rollback one step
              echo "Rolling back one migration..."
              alembic downgrade -1 || {
                echo "WARNING: Rollback failed - manual intervention may be required"
                exit 1
              }

              NEW_STATE=$(alembic current 2>/dev/null | head -1 || echo "none")
              echo "Rolled back to: $NEW_STATE"
          env:
            - name: COPILOT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: omnipotent-db-credentials
                  key: url
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

      volumes:
        - name: tmp
          emptyDir: {}
