apiVersion: v1
kind: Service
metadata:
  name: devops-copilot
  namespace: devops-copilot
  labels:
    app.kubernetes.io/name: devops-copilot
    app.kubernetes.io/component: api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: devops-copilot
    app.kubernetes.io/component: api
---
apiVersion: v1
kind: Service
metadata:
  name: devops-copilot-headless
  namespace: devops-copilot
  labels:
    app.kubernetes.io/name: devops-copilot
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: devops-copilot
    app.kubernetes.io/component: api
