apiVersion: v1
kind: Service
metadata:
  name: omnipotent
  namespace: omnipotent
  labels:
    app.kubernetes.io/name: omnipotent
    app.kubernetes.io/component: api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: omnipotent
    app.kubernetes.io/component: api
---
apiVersion: v1
kind: Service
metadata:
  name: omnipotent-headless
  namespace: omnipotent
  labels:
    app.kubernetes.io/name: omnipotent
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: omnipotent
    app.kubernetes.io/component: api
