apiVersion: v1
kind: ServiceAccount
metadata:
  name: devops-copilot
  namespace: devops-copilot
  labels:
    app.kubernetes.io/name: devops-copilot
  annotations:
    # For AWS EKS IRSA (IAM Roles for Service Accounts)
    # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/devops-copilot-role
    # For GKE Workload Identity
    # iam.gke.io/gcp-service-account: devops-copilot@PROJECT.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devops-copilot
  namespace: devops-copilot
  labels:
    app.kubernetes.io/name: devops-copilot
rules:
  # Allow reading pods for K8s MCP server
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  # Allow reading deployments for rollback/scale operations
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  # Allow modifying deployments for auto-remediation (with approval)
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devops-copilot
  namespace: devops-copilot
  labels:
    app.kubernetes.io/name: devops-copilot
subjects:
  - kind: ServiceAccount
    name: devops-copilot
    namespace: devops-copilot
roleRef:
  kind: Role
  name: devops-copilot
  apiGroup: rbac.authorization.k8s.io
---
# ClusterRole for cross-namespace observability (optional)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devops-copilot-reader
  labels:
    app.kubernetes.io/name: devops-copilot
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devops-copilot-reader
  labels:
    app.kubernetes.io/name: devops-copilot
subjects:
  - kind: ServiceAccount
    name: devops-copilot
    namespace: devops-copilot
roleRef:
  kind: ClusterRole
  name: devops-copilot-reader
  apiGroup: rbac.authorization.k8s.io
