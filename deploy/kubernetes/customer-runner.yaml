apiVersion: v1
kind: ServiceAccount
metadata:
  name: omnipotent-customer-runner
  namespace: omnipotent
  labels:
    app.kubernetes.io/name: omnipotent-customer-runner
    app.kubernetes.io/component: customer-runner
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnipotent-customer-runner
  namespace: omnipotent
  labels:
    app.kubernetes.io/name: omnipotent-customer-runner
    app.kubernetes.io/component: customer-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: omnipotent-customer-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omnipotent-customer-runner
        app.kubernetes.io/component: customer-runner
    spec:
      serviceAccountName: omnipotent-customer-runner
      automountServiceAccountToken: false
      containers:
        - name: runner
          image: ghcr.io/ankit25bcs10610/omnipotent:latest
          imagePullPolicy: Always
          command: ["uv", "run", "uvicorn", "app.customer_runner_service:app", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - name: http
              containerPort: 8001
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: omnipotent-customer-runner
  namespace: omnipotent
spec:
  selector:
    app.kubernetes.io/name: omnipotent-customer-runner
  ports:
    - name: http
      port: 8001
      targetPort: http
