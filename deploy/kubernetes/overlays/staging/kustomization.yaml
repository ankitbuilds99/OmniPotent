# Kustomize overlay for staging environment
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: omnipotent-staging

namePrefix: staging-

commonLabels:
  environment: staging
  app.kubernetes.io/instance: staging

commonAnnotations:
  config.kubernetes.io/managed-by: argocd

resources:
  - ../../

# Staging-specific patches
patches:
  # Reduce replicas for staging
  - target:
      kind: Deployment
      name: omnipotent-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2

  # Lower resource limits for staging
  - target:
      kind: Deployment
      name: omnipotent-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "2Gi"

  # Staging HPA settings
  - target:
      kind: HorizontalPodAutoscaler
      name: omnipotent-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 5

# ConfigMap generator for staging-specific config
configMapGenerator:
  - name: omnipotent-config
    behavior: merge
    literals:
      - ENVIRONMENT=staging
      - LOG_LEVEL=DEBUG
      - ENABLE_DEBUG_ENDPOINTS=true
      - RATE_LIMIT_MULTIPLIER=2

# Secret generator (references external secrets in production)
secretGenerator:
  - name: omnipotent-secrets
    behavior: merge
    literals:
      - SENTRY_ENVIRONMENT=staging

images:
  - name: omnipotent-api
    newTag: latest
