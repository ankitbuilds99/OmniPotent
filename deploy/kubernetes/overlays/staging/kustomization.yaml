# Kustomize overlay for staging environment
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: omnipotent-staging

namePrefix: staging-

commonLabels:
  environment: staging
  app.kubernetes.io/instance: staging

commonAnnotations:
  config.kubernetes.io/managed-by: argocd

resources:
  - ../../

# Staging-specific patches
patches:
  # Replicas PINNED TO 1 — TEMPORARY; in-memory authoritative state. See
  # deploy/helm/copilot/values.yaml for the store list and revert condition.
  # RESTORE 2 WHEN those stores are externalised.
  - target:
      kind: Deployment
      name: omnipotent-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  # Lower resource limits for staging
  - target:
      kind: Deployment
      name: omnipotent-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "2Gi"

  # Staging HPA settings — PINNED TO 1/1, TEMPORARY. This patch would otherwise
  # override the pin in ../../hpa.yaml. Authoritative business state lives in
  # module-level Python dicts; see deploy/helm/copilot/values.yaml for the store
  # list and revert condition. RESTORE 2/5 WHEN those stores are externalised.
  - target:
      kind: HorizontalPodAutoscaler
      name: omnipotent-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 1

# ConfigMap generator for staging-specific config
configMapGenerator:
  - name: omnipotent-config
    behavior: merge
    literals:
      - ENVIRONMENT=staging
      - LOG_LEVEL=DEBUG
      - ENABLE_DEBUG_ENDPOINTS=true
      - RATE_LIMIT_MULTIPLIER=2

# Secret generator (references external secrets in production)
secretGenerator:
  - name: omnipotent-secrets
    behavior: merge
    literals:
      - SENTRY_ENVIRONMENT=staging

images:
  - name: omnipotent-api
    newTag: latest
