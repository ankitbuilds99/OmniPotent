# Additional PDB for worker pods
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: omnipotent-worker-pdb
  labels:
    app.kubernetes.io/name: omnipotent-worker
    app.kubernetes.io/component: worker
    environment: production
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: omnipotent-worker
      environment: production
