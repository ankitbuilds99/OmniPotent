apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: omnipotent
  namespace: omnipotent
  labels:
    app.kubernetes.io/name: omnipotent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: omnipotent
  minReplicas: 3
  maxReplicas: 20
  metrics:
    # Scale on CPU utilization
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Scale on memory utilization
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # Scale on request rate (requires Prometheus adapter)
    # - type: Pods
    #   pods:
    #     metric:
    #       name: http_requests_per_second
    #     target:
    #       type: AverageValue
    #       averageValue: "100"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: omnipotent
  namespace: omnipotent
  labels:
    app.kubernetes.io/name: omnipotent
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: omnipotent
      app.kubernetes.io/component: api
