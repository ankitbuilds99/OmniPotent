apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: omnipotent

resources:
  - namespace.yaml
  - configmap.yaml
  # The `omnipotent-secrets` Secret is deliberately NOT a resource here:
  # shipping one in git means `kubectl apply -k` deploys attacker-known
  # credentials. Provision it out of band — either via external-secret.yaml
  # (External Secrets Operator) or by copying secret.yaml.example, filling in
  # real values, and applying it manually.
  - serviceaccount.yaml
  # Runs `alembic upgrade head` before the Deployment rolls (ArgoCD sync-wave -1).
  - base/migration-job.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - networkpolicy.yaml

commonLabels:
  app.kubernetes.io/name: omnipotent
  app.kubernetes.io/version: "1.0.0"
  app.kubernetes.io/managed-by: kustomize

images:
  - name: ghcr.io/ankit25bcs10610/omnipotent
    newTag: latest
