apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: omnipotent

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - serviceaccount.yaml
  # Runs `alembic upgrade head` before the Deployment rolls (ArgoCD sync-wave -1).
  - base/migration-job.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - networkpolicy.yaml

commonLabels:
  app.kubernetes.io/name: omnipotent
  app.kubernetes.io/version: "1.0.0"
  app.kubernetes.io/managed-by: kustomize

images:
  - name: ghcr.io/ankit25bcs10610/omnipotent
    newTag: latest
