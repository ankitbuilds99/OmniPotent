apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devops-copilot

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - networkpolicy.yaml

commonLabels:
  app.kubernetes.io/name: devops-copilot
  app.kubernetes.io/version: "1.0.0"
  app.kubernetes.io/managed-by: kustomize

images:
  - name: ghcr.io/ankit25bcs10610/devops-copilot
    newTag: latest
