apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: omnipotent
  namespace: omnipotent
spec:
  scaleTargetRef:
    name: omnipotent
  pollingInterval: 15
  cooldownPeriod: 300
  # PINNED TO 1/1 — TEMPORARY. This was the widest blast radius of the in-memory
  # state bug: 50 pods each holding their own private copy of the customer and
  # billing-usage dicts, with KEDA free to destroy any of them on scale-down.
  # See deploy/helm/copilot/values.yaml for the store list and revert condition.
  # RESTORE 3/50 (fallback 5) WHEN: those stores are externalised.
  minReplicaCount: 1
  maxReplicaCount: 1
  fallback:
    failureThreshold: 3
    replicas: 1
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 10
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
  triggers:
    # 1. Request rate from Prometheus
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring:9090
        metricName: http_requests_per_second
        query: |
          sum(rate(http_requests_total{
            namespace="omnipotent",
            service="omnipotent"
          }[2m])) /
          count(kube_pod_info{
            namespace="omnipotent",
            pod=~"omnipotent.*"
          })
        threshold: "100"
        activationThreshold: "50"

    # 2. Active investigations (LangGraph agent sessions)
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring:9090
        metricName: active_investigations
        query: |
          sum(copilot_active_investigations{
            namespace="omnipotent"
          })
        threshold: "20"
        activationThreshold: "10"

    # 3. LLM request queue depth
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring:9090
        metricName: llm_queue_depth
        query: |
          sum(copilot_llm_pending_requests{
            namespace="omnipotent"
          })
        threshold: "50"
        activationThreshold: "25"

    # 4. P95 response latency (scale up when slow)
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring:9090
        metricName: response_latency_p95
        query: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket{
              namespace="omnipotent"
            }[5m])) by (le)
          )
        threshold: "2.0"
        activationThreshold: "1.0"

    # 5. Redis job queue length (Dramatiq tasks)
    - type: redis
      metadata:
        address: redis.omnipotent:6379
        listName: dramatiq:default
        listLength: "100"
        activationListLength: "50"
      authenticationRef:
        name: redis-auth
