# External Secrets - Use instead of secret.yaml
# Requires External Secrets Operator: https://external-secrets.io/
#
# Setup:
# 1. Install External Secrets Operator
# 2. Configure a SecretStore (Vault, AWS Secrets Manager, etc.)
# 3. Apply this ExternalSecret
# 4. Delete secret.yaml from version control
#
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: copilot-secrets
  namespace: devops-copilot
  labels:
    app: devops-copilot
    component: secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend  # or aws-secretsmanager, gcp-secretmanager, etc.
    kind: ClusterSecretStore
  target:
    name: copilot-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app: devops-copilot
  data:
    # LLM API Keys
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: secret/devops-copilot/prod
        property: anthropic_api_key

    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: secret/devops-copilot/prod
        property: openai_api_key

    # Database
    - secretKey: COPILOT_DATABASE_URL
      remoteRef:
        key: secret/devops-copilot/prod
        property: database_url

    # Application secrets
    - secretKey: COPILOT_SECRET_KEY
      remoteRef:
        key: secret/devops-copilot/prod
        property: secret_key

    # Webhook secrets
    - secretKey: GITHUB_WEBHOOK_SECRET
      remoteRef:
        key: secret/devops-copilot/prod
        property: github_webhook_secret

    - secretKey: GITLAB_WEBHOOK_SECRET
      remoteRef:
        key: secret/devops-copilot/prod
        property: gitlab_webhook_secret

    - secretKey: SLACK_SIGNING_SECRET
      remoteRef:
        key: secret/devops-copilot/prod
        property: slack_signing_secret

    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: secret/devops-copilot/prod
        property: stripe_webhook_secret

    # Integration tokens
    - secretKey: DATADOG_API_KEY
      remoteRef:
        key: secret/devops-copilot/prod
        property: datadog_api_key

    - secretKey: PAGERDUTY_API_KEY
      remoteRef:
        key: secret/devops-copilot/prod
        property: pagerduty_api_key

    - secretKey: SENTRY_DSN
      remoteRef:
        key: secret/devops-copilot/prod
        property: sentry_dsn

---
# Alternative: AWS Secrets Manager SecretStore
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets

---
# Alternative: HashiCorp Vault SecretStore
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "https://vault.example.com"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "devops-copilot"
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
