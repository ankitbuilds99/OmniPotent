apiVersion: v1
kind: ConfigMap
metadata:
  name: omnipotent-config
  namespace: omnipotent
  labels:
    app.kubernetes.io/name: omnipotent
data:
  # Every key here must be the env-var spelling of a field on app/config.py's
  # Settings model. Settings is declared extra="ignore", so a key it does not
  # know is dropped without a warning and the knob silently does nothing;
  # tests/test_deploy_manifests.py pins the mapping.
  #
  # COPILOT_ENV drives every fail-closed branch in Settings: without it the pods
  # ran as "development", which means permissive CORS (localhost origins are
  # allowed unconditionally), no HSTS, and a /readyz that can never return 503.
  # In production it also makes Settings refuse to start without
  # COPILOT_API_TOKEN, and without COPILOT_SECRET_KEY while COPILOT_MULTI_TENANT
  # is true — both come from the out-of-band `omnipotent-secrets` Secret
  # (external-secret.yaml or a filled-in copy of secret.yaml.example).
  COPILOT_ENV: "production"
  COPILOT_LOG_LEVEL: "INFO"
  COPILOT_LOG_FORMAT: "json"
  COPILOT_MULTI_TENANT: "true"
  COPILOT_RATE_LIMIT_PER_MIN: "60"
  COPILOT_MAX_SESSIONS: "100"
  COPILOT_MAX_MESSAGE_CHARS: "50000"
  COPILOT_DB_POOL_SIZE: "10"
  COPILOT_DB_POOL_OVERFLOW: "20"
  OTEL_SERVICE_NAME: "omnipotent"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
