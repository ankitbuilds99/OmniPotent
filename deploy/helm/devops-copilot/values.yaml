# DevOps Copilot Helm Values
# Override these for your environment

replicaCount: 2

# COPILOT_ENV. "production" makes Settings fail closed without an API token and
# turns on JSON logging + HSTS. The ArgoCD ApplicationSet overrides this per env.
environment: production

image:
  # The image the release pipeline publishes (see deploy/kubernetes/kustomization.yaml).
  repository: ghcr.io/ankit25bcs10610/omnipotent
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  # /metrics returns the dashboard's JSON metric series; /metrics/slo is the
  # Prometheus text exposition endpoint (app/api/main.py).
  prometheus.io/path: "/metrics/slo"

# UID 10001 is the `appuser` the Dockerfile creates and chowns /app + /data to.
podSecurityContext:
  fsGroup: 10001
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: omnipotent.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: omnipotent-tls
      hosts:
        - omnipotent.example.com

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - omnipotent
          topologyKey: kubernetes.io/hostname

# Application configuration -> ConfigMap. Each entry maps to a Settings field in
# app/config.py; see templates/configmap.yaml for the env-var spelling.
config:
  logLevel: INFO          # COPILOT_LOG_LEVEL
  logFormat: json         # COPILOT_LOG_FORMAT (json|human)
  multiTenant: true       # COPILOT_MULTI_TENANT
  corsOrigins: ""         # CORS_ORIGINS, comma-separated; empty = same-origin only

# External secrets. Prefer `existingSecret` populated by the external-secrets
# operator / sealed-secrets; the inline values below are for dev clusters only.
secrets:
  existingSecret: ""
  # COPILOT_API_TOKEN — required when environment=production, the app refuses to
  # start without it. Set via `--set secrets.apiToken=...` or existingSecret.
  apiToken: ""
  # COPILOT_SECRET_KEY — required when config.multiTenant=true in production.
  secretKey: ""
  anthropicApiKey: ""
  supabaseUrl: ""
  supabaseAnonKey: ""
  supabaseServiceRoleKey: ""
  stripeApiKey: ""
  stripeWebhookSecret: ""
  slackBotToken: ""
  pagerdutyApiKey: ""
  datadogApiKey: ""
  sentryDsn: ""

# Redis configuration
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    password: ""  # Set via --set redis.auth.password
  master:
    persistence:
      enabled: true
      size: 1Gi

# PostgreSQL configuration
postgresql:
  enabled: true
  auth:
    database: omnipotent
    username: copilot
    password: ""  # Set via --set postgresql.auth.password
  primary:
    persistence:
      enabled: true
      size: 10Gi

# Health checks
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    # /readyz, not /healthz: readiness must be able to fail (503 when the pod
    # cannot actually serve investigations). /healthz is liveness-only.
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Network policy
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
