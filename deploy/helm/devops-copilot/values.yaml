# DevOps Copilot Helm Values
# Override these for your environment

replicaCount: 2

image:
  repository: omnipotent-api
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/metrics"

podSecurityContext:
  fsGroup: 10001
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: omnipotent.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: omnipotent-tls
      hosts:
        - omnipotent.example.com

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - omnipotent
          topologyKey: kubernetes.io/hostname

# Application configuration
config:
  logLevel: INFO
  multiTenant: true
  corsOrigins: "*"

# External secrets (use external-secrets operator or sealed-secrets in production)
secrets:
  # Set these via --set or external secret management
  anthropicApiKey: ""
  supabaseUrl: ""
  supabaseAnonKey: ""
  supabaseServiceKey: ""
  stripeSecretKey: ""
  slackBotToken: ""
  pagerdutyApiKey: ""
  datadogApiKey: ""

# Redis configuration
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    password: ""  # Set via --set redis.auth.password
  master:
    persistence:
      enabled: true
      size: 1Gi

# PostgreSQL configuration
postgresql:
  enabled: true
  auth:
    database: omnipotent
    username: copilot
    password: ""  # Set via --set postgresql.auth.password
  primary:
    persistence:
      enabled: true
      size: 10Gi

# Health checks
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Network policy
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
