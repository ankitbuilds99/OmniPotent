apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "omnipotent.fullname" . }}-config
  labels:
    {{- include "omnipotent.labels" . | nindent 4 }}
data:
  # Every key here must be a real field on app/config.py:Settings — the model is
  # declared with extra="ignore", so a misspelt key is silently discarded rather
  # than rejected. tests/test_deploy_manifests.py enforces the mapping.
  COPILOT_ENV: {{ .Values.environment | quote }}
  COPILOT_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  COPILOT_LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  COPILOT_MULTI_TENANT: {{ .Values.config.multiTenant | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
