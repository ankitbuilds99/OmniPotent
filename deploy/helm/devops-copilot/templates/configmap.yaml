apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "omnipotent.fullname" . }}-config
  labels:
    {{- include "omnipotent.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  COPILOT_MULTI_TENANT: {{ .Values.config.multiTenant | quote }}
  COPILOT_CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  COPILOT_REDIS_ENABLED: {{ .Values.redis.enabled | quote }}
