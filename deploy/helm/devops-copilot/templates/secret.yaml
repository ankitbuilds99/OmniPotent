apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omnipotent.fullname" . }}-secrets
  labels:
    {{- include "omnipotent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.supabaseUrl }}
  SUPABASE_URL: {{ .Values.secrets.supabaseUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.supabaseAnonKey }}
  SUPABASE_ANON_KEY: {{ .Values.secrets.supabaseAnonKey | quote }}
  {{- end }}
  {{- if .Values.secrets.supabaseServiceKey }}
  SUPABASE_SERVICE_KEY: {{ .Values.secrets.supabaseServiceKey | quote }}
  {{- end }}
  {{- if .Values.secrets.stripeSecretKey }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | quote }}
  {{- end }}
  {{- if .Values.secrets.slackBotToken }}
  SLACK_BOT_TOKEN: {{ .Values.secrets.slackBotToken | quote }}
  {{- end }}
  {{- if .Values.secrets.pagerdutyApiKey }}
  PAGERDUTY_API_KEY: {{ .Values.secrets.pagerdutyApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.datadogApiKey }}
  DATADOG_API_KEY: {{ .Values.secrets.datadogApiKey | quote }}
  {{- end }}
