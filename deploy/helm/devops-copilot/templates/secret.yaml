{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omnipotent.fullname" . }}-secrets
  labels:
    {{- include "omnipotent.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Keys are the env-var spelling of app/config.py:Settings fields. Settings is
  # extra="ignore", so an invented key is dropped without a word of warning —
  # tests/test_deploy_manifests.py checks each one against the model.
  {{- if .Values.secrets.apiToken }}
  # Mandatory when COPILOT_ENV=production: Settings refuses to construct without
  # it, so the pod CrashLoops on startup rather than serving an open API.
  COPILOT_API_TOKEN: {{ .Values.secrets.apiToken | quote }}
  {{- end }}
  {{- if .Values.secrets.secretKey }}
  # Mandatory when COPILOT_MULTI_TENANT=true in production (per-tenant vault key).
  COPILOT_SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.supabaseUrl }}
  SUPABASE_URL: {{ .Values.secrets.supabaseUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.supabaseAnonKey }}
  SUPABASE_ANON_KEY: {{ .Values.secrets.supabaseAnonKey | quote }}
  {{- end }}
  {{- if .Values.secrets.supabaseServiceRoleKey }}
  SUPABASE_SERVICE_ROLE_KEY: {{ .Values.secrets.supabaseServiceRoleKey | quote }}
  {{- end }}
  {{- if .Values.secrets.stripeApiKey }}
  STRIPE_API_KEY: {{ .Values.secrets.stripeApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.stripeWebhookSecret }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.stripeWebhookSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.slackBotToken }}
  SLACK_BOT_TOKEN: {{ .Values.secrets.slackBotToken | quote }}
  {{- end }}
  {{- if .Values.secrets.pagerdutyApiKey }}
  PAGERDUTY_API_KEY: {{ .Values.secrets.pagerdutyApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.datadogApiKey }}
  DD_API_KEY: {{ .Values.secrets.datadogApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.sentryDsn }}
  SENTRY_DSN: {{ .Values.secrets.sentryDsn | quote }}
  {{- end }}
{{- end }}
