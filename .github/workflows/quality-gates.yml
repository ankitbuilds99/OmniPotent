name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday for mutation testing

jobs:
  # Contract tests
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run contract tests
        run: uv run pytest tests/contract/pact_provider_test.py -v -k "not test_verify"

  # Documentation validation
  docs-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check ADR format
        run: |
          for adr in docs/adr/*.md; do
            if ! grep -q "^## Status" "$adr"; then
              echo "ERROR: $adr missing Status section"
              exit 1
            fi
            if ! grep -q "^## Context" "$adr"; then
              echo "ERROR: $adr missing Context section"
              exit 1
            fi
            if ! grep -q "^## Decision" "$adr"; then
              echo "ERROR: $adr missing Decision section"
              exit 1
            fi
          done
          echo "All ADRs have required sections"

      - name: Check runbook format
        run: |
          for runbook in docs/runbooks/*.md; do
            if [[ "$runbook" == *"TEMPLATE"* ]]; then
              continue
            fi
            if ! grep -q "^## Overview\|^## Detection\|^## Triage" "$runbook"; then
              echo "WARNING: $runbook may be missing standard sections"
            fi
          done
          echo "Runbook check complete"

  # Chaos tests (on main only)
  chaos-tests:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run chaos tests
        run: uv run pytest tests/chaos/fault_injection.py -v --tb=short

  # Mutation testing (weekly only)
  mutation-testing:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 0 * * 0'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: |
          uv sync --extra dev
          uv pip install mutmut

      - name: Run mutation tests
        run: |
          chmod +x tests/mutation/run_mutation_tests.sh
          ./tests/mutation/run_mutation_tests.sh || true

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: html/
