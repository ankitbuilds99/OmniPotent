name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday for mutation testing

jobs:
  # Unit tests with coverage
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install pytest-cov pytest-html pytest-xdist

      - name: Run unit tests
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=80 \
            --html=test-results/report.html \
            -n auto \
            --ignore=tests/load \
            --ignore=tests/chaos \
            --ignore=tests/contract \
            --ignore=tests/mutation

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/

  # Contract tests
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run contract tests
        run: pytest tests/contract/pact_provider_test.py -v -k "not test_verify"

  # Load test baseline (smoke only on PR)
  load-test-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Start test server
        run: |
          uvicorn app.api.main:app --host 0.0.0.0 --port 8000 &
          sleep 10

      - name: Run smoke test
        run: |
          k6 run tests/load/k6_scenarios.js \
            --env BASE_URL=http://localhost:8000 \
            --env API_TOKEN=test-token \
            --scenario smoke \
            --duration 30s

  # Security scan
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Bandit security linter
        run: |
          pip install bandit
          bandit -r app/ -ll -ii

  # Documentation validation
  docs-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check ADR format
        run: |
          for adr in docs/adr/*.md; do
            if ! grep -q "^## Status" "$adr"; then
              echo "ERROR: $adr missing Status section"
              exit 1
            fi
            if ! grep -q "^## Context" "$adr"; then
              echo "ERROR: $adr missing Context section"
              exit 1
            fi
            if ! grep -q "^## Decision" "$adr"; then
              echo "ERROR: $adr missing Decision section"
              exit 1
            fi
          done
          echo "All ADRs have required sections"

      - name: Check runbook format
        run: |
          for runbook in docs/runbooks/*.md; do
            if [[ "$runbook" == *"TEMPLATE"* ]]; then
              continue
            fi
            if ! grep -q "^## Overview\|^## Detection\|^## Triage" "$runbook"; then
              echo "WARNING: $runbook may be missing standard sections"
            fi
          done
          echo "Runbook check complete"

  # Chaos tests (on main only)
  chaos-tests:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run chaos tests
        run: pytest tests/chaos/fault_injection.py -v --tb=short

  # Mutation testing (weekly only)
  mutation-testing:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 0 * * 0'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e ".[dev]" mutmut

      - name: Run mutation tests
        run: |
          chmod +x tests/mutation/run_mutation_tests.sh
          ./tests/mutation/run_mutation_tests.sh || true

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: html/
