name: Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

# Private repo: explicit permissions
permissions:
  contents: write
  packages: write
  id-token: write

env:
  PYTHON_VERSION: "3.11"
  AWS_REGION: us-east-1
  ECR_REPOSITORY: omnipotent-api

jobs:
  # ============================================================================
  # BUILD & TEST (Always runs)
  # ============================================================================
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run linting
        run: uv run ruff check .

      - name: Run type checking
        run: uv run mypy app/ --ignore-missing-imports

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short -x

      - name: Extract metadata
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: omnipotent-api:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

  # ============================================================================
  # BUILD DOCKER IMAGE (Only with AWS credentials)
  # ============================================================================
  build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Check AWS credentials
        id: check-aws
        run: |
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "has_aws=true" >> $GITHUB_OUTPUT
          else
            echo "has_aws=false" >> $GITHUB_OUTPUT
            echo "::warning::AWS credentials not configured. Skipping ECR push."
          fi

      - name: Set up Docker Buildx
        if: steps.check-aws.outputs.has_aws == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        if: steps.check-aws.outputs.has_aws == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.check-aws.outputs.has_aws == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata
        if: steps.check-aws.outputs.has_aws == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        if: steps.check-aws.outputs.has_aws == 'true'
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}
            VERSION=${{ github.ref_name }}

      - name: Scan image with Trivy
        if: steps.check-aws.outputs.has_aws == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
        continue-on-error: true

      - name: Skip notification (no AWS)
        if: steps.check-aws.outputs.has_aws == 'false'
        run: echo "Build completed without AWS push. Configure AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY secrets to enable ECR deployment."

  # ============================================================================
  # DEPLOY TO STAGING (Requires AWS)
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-push
    if: |
      needs.build-push.outputs.image_tag != '' &&
      (github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://staging-api.omnipotent.com

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition omnipotent-api-staging \
            --query taskDefinition > task-definition.json

      - name: Update task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: api
          image: ${{ needs.build-push.outputs.image_tag }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: omnipotent-api
          cluster: omnipotent-staging
          wait-for-service-stability: true

      - name: Run smoke tests
        run: |
          # /healthz, not /health: the SPA catch-all mount answers any unknown
          # extension-less path with index.html, so `curl -sf .../health` returns
          # 200 even when every API route is failing.
          for i in {1..30}; do
            if curl -sf https://staging-api.omnipotent.com/healthz; then
              echo "Health check passed"
              exit 0
            fi
            echo "Waiting for service... ($i/30)"
            sleep 10
          done
          echo "Health check failed"
          exit 1

      - name: Notify Slack - Staging Deploy
        if: always() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} Staging deploy ${{ job.status }}: ${{ github.sha }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Staging Deploy*\nCommit: `${{ github.sha }}`\nStatus: ${{ job.status }}\n<https://staging-api.omnipotent.com|View Staging>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ============================================================================
  # RUN E2E TESTS ON STAGING
  # ============================================================================
  e2e-tests:
    name: E2E Tests on Staging
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run E2E tests
        env:
          API_URL: https://staging-api.omnipotent.com
          TEST_API_KEY: ${{ secrets.TEST_API_KEY }}
        run: |
          uv sync --extra dev
          uv run pytest tests/e2e/ -v --tb=short

  # ============================================================================
  # DEPLOY TO PRODUCTION
  # ============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-push, e2e-tests]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://api.omnipotent.com
    outputs:
      previous_task_def: ${{ steps.save-previous.outputs.task_def_arn }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Save previous task definition for rollback
        id: save-previous
        run: |
          CURRENT_TASK=$(aws ecs describe-services \
            --cluster omnipotent-prod \
            --services omnipotent-api \
            --query 'services[0].taskDefinition' \
            --output text)
          echo "task_def_arn=$CURRENT_TASK" >> $GITHUB_OUTPUT
          echo "Previous task definition: $CURRENT_TASK"

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition omnipotent-api-prod \
            --query taskDefinition > task-definition.json

      - name: Update task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: api
          image: ${{ needs.build-push.outputs.image_tag }}

      - name: Deploy to ECS
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: omnipotent-api
          cluster: omnipotent-prod
          wait-for-service-stability: true

      - name: Run smoke tests
        id: smoke-test
        run: |
          for i in {1..30}; do
            if curl -sf https://api.omnipotent.com/healthz; then
              echo "Health check passed"
              exit 0
            fi
            echo "Waiting for service... ($i/30)"
            sleep 10
          done
          echo "Health check failed"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          echo "Deployment failed smoke tests. Rolling back to previous version..."
          aws ecs update-service \
            --cluster omnipotent-prod \
            --service omnipotent-api \
            --task-definition ${{ steps.save-previous.outputs.task_def_arn }} \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster omnipotent-prod \
            --services omnipotent-api
          echo "Rollback completed"

      - name: Notify Slack - Production Deploy
        if: always() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && ':rocket:' || ':rotating_light:' }} Production deploy ${{ job.status }}: ${{ github.ref_name }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deploy*\nVersion: `${{ github.ref_name }}`\nCommit: `${{ github.sha }}`\nStatus: ${{ job.status }}${{ job.status == 'failure' && '\n:warning: Automatic rollback initiated' || '' }}\n<https://api.omnipotent.com|View Production>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ============================================================================
  # MANUAL ROLLBACK
  # ============================================================================
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment != ''
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get previous task definition
        id: previous
        run: |
          CLUSTER=${{ github.event.inputs.environment == 'production' && 'omnipotent-prod' || 'omnipotent-staging' }}
          TASK_DEF=${{ github.event.inputs.environment == 'production' && 'omnipotent-api-prod' || 'omnipotent-api-staging' }}

          # Get previous task definition revision
          CURRENT=$(aws ecs describe-task-definition \
            --task-definition $TASK_DEF \
            --query 'taskDefinition.revision' \
            --output text)
          PREVIOUS=$((CURRENT - 1))

          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "previous=$PREVIOUS" >> $GITHUB_OUTPUT
          echo "cluster=$CLUSTER" >> $GITHUB_OUTPUT
          echo "task_def=$TASK_DEF" >> $GITHUB_OUTPUT
          echo "Rolling back from revision $CURRENT to $PREVIOUS"

      - name: Rollback to previous version
        run: |
          aws ecs update-service \
            --cluster ${{ steps.previous.outputs.cluster }} \
            --service omnipotent-api \
            --task-definition ${{ steps.previous.outputs.task_def }}:${{ steps.previous.outputs.previous }} \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster ${{ steps.previous.outputs.cluster }} \
            --services omnipotent-api

          echo "Rollback completed successfully"

      - name: Notify Slack - Rollback
        if: always() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": ":rewind: ${{ github.event.inputs.environment }} rollback ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Rollback*\nEnvironment: `${{ github.event.inputs.environment }}`\nFrom revision: `${{ steps.previous.outputs.current }}`\nTo revision: `${{ steps.previous.outputs.previous }}`\nStatus: ${{ job.status }}\nTriggered by: ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ============================================================================
  # DATABASE MIGRATIONS (Requires staging secrets)
  # ============================================================================
  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: [build-test]
    if: github.ref == 'refs/heads/main'
    environment: staging
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Check database URL
        id: check-db
        run: |
          if [ -n "${{ secrets.STAGING_DATABASE_URL }}" ]; then
            echo "has_db=true" >> $GITHUB_OUTPUT
          else
            echo "has_db=false" >> $GITHUB_OUTPUT
            echo "::warning::STAGING_DATABASE_URL not configured. Skipping migrations."
          fi

      - name: Install uv
        if: steps.check-db.outputs.has_db == 'true'
        uses: astral-sh/setup-uv@v5

      - name: Run migrations
        if: steps.check-db.outputs.has_db == 'true'
        env:
          COPILOT_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          uv sync --extra migrations
          uv run alembic upgrade head

  # ============================================================================
  # RELEASE NOTES
  # ============================================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log HEAD --pretty=format:"- %s (%h)" --no-merges -20)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.changelog }}

            ## Docker Image
            ```
            omnipotent-api:${{ github.ref_name }}
            ```
          generate_release_notes: true
