name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * *'  # Daily at 4 AM UTC

permissions:
  contents: read
  pull-requests: write

jobs:
  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omnipotent
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: omnipotent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://omnipotent:test_password@localhost:5432/omnipotent_test
      REDIS_URL: redis://localhost:6379/0
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Wait for services
        run: |
          until pg_isready -h localhost -p 5432; do sleep 1; done
          until redis-cli -h localhost ping; do sleep 1; done

      - name: Run database migrations
        run: |
          uv run alembic upgrade head || echo "No migrations to run"

      - name: Run integration tests
        run: |
          uv run pytest tests/integration/ \
            -v \
            --tb=short \
            -m integration \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=integration-results.xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          flags: integration
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: integration-results.xml

  api-contract:
    runs-on: ubuntu-latest
    needs: integration

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Generate OpenAPI spec
        run: |
          uv run python -c "
          from app.api.main import app
          import json
          spec = app.openapi()
          with open('openapi.json', 'w') as f:
              json.dump(spec, f, indent=2)
          "

      - name: Validate OpenAPI spec
        run: |
          npx @redocly/cli lint openapi.json --skip-rule=no-server-example.com

      - name: Check for breaking changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          git checkout origin/${{ github.base_ref }} -- openapi.json 2>/dev/null && \
            mv openapi.json openapi-base.json || echo "No previous spec"

          if [ -f openapi-base.json ]; then
            npx oasdiff breaking openapi-base.json openapi.json || true
          fi

  dependency-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Run safety check
        run: |
          uv pip list --format=freeze > requirements.txt
          pip install safety
          safety check -r requirements.txt --full-report || true

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner=off || true

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'OmniPotent'
          path: '.'
          format: 'HTML'
          out: 'reports'
        continue-on-error: true

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports/

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: omnipotent:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container smoke test
        run: |
          docker run -d --name omnipotent-test \
            -p 8000:8000 \
            -e DATABASE_URL=sqlite:///./test.db \
            -e REDIS_URL=redis://localhost:6379 \
            omnipotent:test || exit 0

          sleep 5

          curl -f http://localhost:8000/health || echo "Health check skipped (no DB)"

          docker logs omnipotent-test || true
          docker stop omnipotent-test || true

  coverage-gate:
    runs-on: ubuntu-latest
    needs: integration
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: integration-test-results

      - name: Check coverage threshold
        run: |
          COVERAGE=$(grep -oP 'line-rate="\K[^"]+' coverage.xml 2>/dev/null | head -1 || echo "0")
          COVERAGE_PCT=$(echo "$COVERAGE * 100" | bc 2>/dev/null || echo "0")

          echo "Coverage: ${COVERAGE_PCT}%"

          if (( $(echo "$COVERAGE_PCT < 70" | bc -l 2>/dev/null || echo "0") )); then
            echo "::warning::Coverage below 70% threshold"
          fi
