name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * *'  # Daily at 4 AM UTC

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write

env:
  POSTGRES_USER: omnipotent
  POSTGRES_PASSWORD: test_password_ci
  POSTGRES_DB: omnipotent_test
  REDIS_URL: redis://localhost:6379

jobs:
  # ============================================================================
  # INTEGRATION TESTS WITH REAL DATABASE
  # ============================================================================
  integration-tests:
    name: Integration Tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U $POSTGRES_USER"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev --extra test --extra migrations

      - name: Wait for services
        run: |
          # Wait for PostgreSQL using nc (netcat)
          for i in {1..30}; do
            if nc -z localhost 5432; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

          # Wait for Redis using nc
          for i in {1..30}; do
            if nc -z localhost 6379; then
              echo "Redis is ready"
              break
            fi
            echo "Waiting for Redis... ($i/30)"
            sleep 2
          done

          # Give services a moment to fully initialize
          sleep 3
          echo "All services are ready"

      - name: Run database migrations
        env:
          COPILOT_DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
        run: |
          uv run alembic upgrade head

      - name: Run integration tests
        env:
          COPILOT_DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          REDIS_URL: ${{ env.REDIS_URL }}
          TESTING: "true"
        run: |
          uv run pytest tests/integration/ -v \
            --tb=short \
            --junitxml=integration-results.xml \
            -x

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: integration-results.xml

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: integration-results.xml
          check_name: Integration Test Results

  # ============================================================================
  # API CONTRACT TESTS
  # ============================================================================
  api-contract-tests:
    name: API Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Generate OpenAPI schema
        run: |
          uv run python -c "
          from app.api.main import app
          import json
          schema = app.openapi()
          with open('openapi.json', 'w') as f:
              json.dump(schema, f, indent=2)
          "

      - name: Validate OpenAPI schema
        run: |
          npx @apidevtools/swagger-cli validate openapi.json

      - name: Check for breaking changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main
          git show origin/main:openapi.json > openapi-main.json 2>/dev/null || echo '{}' > openapi-main.json

          # Use oasdiff to check for breaking changes
          npx oasdiff breaking openapi-main.json openapi.json --fail-on ERR || {
            echo "::warning::Potential breaking API changes detected. Please review."
          }

      - name: Upload OpenAPI schema
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: openapi.json

  # ============================================================================
  # COVERAGE ENFORCEMENT
  # ============================================================================
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    # The full suite under coverage takes ~15m on these runners and grows with
    # every test added; 15 killed the job at 99% passed. Keep headroom.
    timeout-minutes: 25

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Run tests with coverage
        env:
          REDIS_URL: redis://localhost:6379
        run: |
          uv run pytest tests/ \
            --ignore=tests/integration \
            --ignore=tests/e2e \
            --ignore=tests/load \
            --cov=app \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --cov-fail-under=38 \
            -v

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

      - name: Coverage comment on PR
        uses: py-cov-action/python-coverage-comment-action@v3
        if: github.event_name == 'pull_request'
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 60

  # ============================================================================
  # DEPENDENCY SCANNING
  # ============================================================================
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Export requirements
        run: |
          uv export --no-hashes > requirements.txt

      - name: Run pip-audit
        run: |
          uv venv .audit-venv
          source .audit-venv/bin/activate
          pip install pip-audit
          pip-audit -r requirements.txt --desc --format json > pip-audit-results.json || true
          cat pip-audit-results.json

      - name: Run Safety check
        run: |
          source .audit-venv/bin/activate
          pip install safety
          safety check -r requirements.txt --json > safety-results.json || true
          cat safety-results.json

      - name: Run Snyk (if token available)
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=requirements.txt --severity-threshold=high

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan-results
          path: |
            pip-audit-results.json
            safety-results.json

      - name: Check for critical vulnerabilities
        run: |
          CRITICAL=$(jq '[.dependencies[]?.vulns[]? | select(.severity == "critical")] | length' pip-audit-results.json 2>/dev/null || echo "0")
          if [ "$CRITICAL" -gt "0" ]; then
            echo "::error::Found $CRITICAL critical vulnerabilities"
            exit 1
          fi
          echo "No critical vulnerabilities found"

  # ============================================================================
  # DOCKER BUILD VALIDATION
  # ============================================================================
  docker-validation:
    name: Docker Build Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: omnipotent-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/image.tar

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          input: /tmp/image.tar
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Test container startup
        run: |
          docker load --input /tmp/image.tar
          docker run -d --name test-container \
            -e REDIS_URL=redis://host.docker.internal:6379 \
            -e DATABASE_URL=sqlite:///test.db \
            -p 8000:8000 \
            omnipotent-api:test

          # Wait for health check
          for i in {1..30}; do
            if docker exec test-container curl -sf http://localhost:8000/healthz; then
              echo "Container is healthy"
              docker stop test-container
              exit 0
            fi
            echo "Waiting for container... ($i/30)"
            sleep 2
          done

          docker logs test-container
          docker stop test-container
          exit 1
