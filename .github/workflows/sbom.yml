name: SBOM Generation

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  release:
    types: [published]
  schedule:
    - cron: '0 3 * * 1'  # Weekly on Monday at 3 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  security-events: write

jobs:
  generate-sbom:
    name: Generate Software Bill of Materials
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # =======================================================================
      # PYTHON SBOM (CycloneDX format)
      # =======================================================================
      - name: Generate Python SBOM
        run: |
          uv pip install cyclonedx-bom
          uv export --no-hashes > requirements.txt
          cyclonedx-py requirements \
            --input-file requirements.txt \
            --output-format json \
            --output-file sbom-python.json \
            --schema-version 1.5

      - name: Generate Python SBOM (SPDX format)
        run: |
          uv pip install spdx-tools
          cyclonedx-py requirements \
            --input-file requirements.txt \
            --output-format xml \
            --output-file sbom-python.xml

      # =======================================================================
      # FRONTEND SBOM
      # =======================================================================
      - name: Generate Frontend SBOM
        working-directory: frontend
        run: |
          npm ci
          npx @cyclonedx/cyclonedx-npm --output-format json --output-file ../sbom-frontend.json

      # =======================================================================
      # DOCKER IMAGE SBOM (Syft)
      # =======================================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for SBOM
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: omnipotent-api:sbom
          cache-from: type=gha

      - name: Generate Docker SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: omnipotent-api:sbom
          format: cyclonedx-json
          output-file: sbom-docker.json

      # =======================================================================
      # MERGE & UPLOAD
      # =======================================================================
      - name: Merge SBOMs
        run: |
          # Install jq for JSON manipulation
          sudo apt-get install -y jq

          # Create merged SBOM
          jq -s '
            {
              "bomFormat": "CycloneDX",
              "specVersion": "1.5",
              "version": 1,
              "metadata": {
                "timestamp": (now | todate),
                "tools": [
                  {"vendor": "CycloneDX", "name": "cyclonedx-bom"},
                  {"vendor": "Anchore", "name": "syft"}
                ],
                "component": {
                  "type": "application",
                  "name": "omnipotent",
                  "version": "${{ github.ref_name }}"
                }
              },
              "components": (.[0].components + .[1].components + (.[2].components // []) | unique_by(.purl // .name))
            }
          ' sbom-python.json sbom-frontend.json sbom-docker.json > sbom-merged.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom-python.json
            sbom-frontend.json
            sbom-docker.json
            sbom-merged.json
          retention-days: 90

      - name: Attach SBOM to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            sbom-merged.json
            sbom-python.json
            sbom-frontend.json

      # =======================================================================
      # VULNERABILITY SCAN
      # =======================================================================
      - name: Scan SBOM for vulnerabilities (Grype)
        uses: anchore/scan-action@v4
        id: scan
        with:
          sbom: sbom-merged.json
          fail-build: false
          severity-cutoff: high

      - name: Upload vulnerability report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

      - name: Generate vulnerability summary
        run: |
          echo "## SBOM Vulnerability Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python dependencies | $(jq '.components | length' sbom-python.json) |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend dependencies | $(jq '.components | length' sbom-frontend.json) |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker image layers | $(jq '.components | length' sbom-docker.json) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "SBOM artifacts uploaded. See Artifacts section for downloads." >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # DEPENDENCY GRAPH SUBMISSION
  # ===========================================================================
  submit-dependency-graph:
    name: Submit Dependency Graph
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Generate dependency graph
        run: |
          uv export --no-hashes > requirements.txt

      - name: Submit Python dependencies
        uses: advanced-security/dependency-review-action@v4
        with:
          fail-on-severity: critical
        continue-on-error: true
