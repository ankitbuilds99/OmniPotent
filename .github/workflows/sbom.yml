name: SBOM Generation

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  release:
    types: [published]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  security-events: write

jobs:
  generate-sbom:
    name: Generate Software Bill of Materials
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create virtual environment
        run: uv venv

      - name: Generate Python SBOM
        run: |
          uv pip install cyclonedx-bom
          uv export --no-hashes > requirements.txt
          uv run cyclonedx-py requirements requirements.txt \
            --of json \
            -o sbom-python.json \
          || echo '{"bomFormat":"CycloneDX","specVersion":"1.5","components":[]}' > sbom-python.json

      - name: Generate Frontend SBOM
        working-directory: frontend
        run: |
          npm ci
          npx @cyclonedx/cyclonedx-npm --output-format json --output-file ../sbom-frontend.json
        continue-on-error: true

      - name: Create placeholder if frontend SBOM failed
        run: |
          if [ ! -f sbom-frontend.json ]; then
            echo '{"bomFormat":"CycloneDX","specVersion":"1.5","components":[]}' > sbom-frontend.json
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for SBOM
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: omnipotent-api:sbom
          cache-from: type=gha
        continue-on-error: true

      - name: Generate Docker SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: omnipotent-api:sbom
          format: cyclonedx-json
          output-file: sbom-docker.json
        continue-on-error: true

      - name: Create placeholder if Docker SBOM failed
        run: |
          if [ ! -f sbom-docker.json ]; then
            echo '{"bomFormat":"CycloneDX","specVersion":"1.5","components":[]}' > sbom-docker.json
          fi

      - name: Merge SBOMs
        run: |
          sudo apt-get install -y jq
          jq -s '
            {
              "bomFormat": "CycloneDX",
              "specVersion": "1.5",
              "version": 1,
              "metadata": {
                "timestamp": (now | todate),
                "component": {
                  "type": "application",
                  "name": "omnipotent",
                  "version": "${{ github.ref_name }}"
                }
              },
              "components": ([.[0].components, .[1].components, .[2].components] | add | map(select(. != null)) | unique_by(.name))
            }
          ' sbom-python.json sbom-frontend.json sbom-docker.json > sbom-merged.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom-python.json
            sbom-frontend.json
            sbom-docker.json
            sbom-merged.json
          retention-days: 90

      - name: Attach SBOM to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            sbom-merged.json
            sbom-python.json
            sbom-frontend.json

      - name: Scan SBOM for vulnerabilities (Grype)
        uses: anchore/scan-action@v4
        id: scan
        with:
          sbom: sbom-merged.json
          fail-build: false
          severity-cutoff: critical
        continue-on-error: true

      - name: Upload vulnerability report
        uses: github/codeql-action/upload-sarif@v3
        if: steps.scan.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
        continue-on-error: true

      - name: Generate vulnerability summary
        run: |
          echo "## SBOM Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          PYTHON_COUNT=$(jq '.components | length // 0' sbom-python.json 2>/dev/null || echo "0")
          FRONTEND_COUNT=$(jq '.components | length // 0' sbom-frontend.json 2>/dev/null || echo "0")
          DOCKER_COUNT=$(jq '.components | length // 0' sbom-docker.json 2>/dev/null || echo "0")
          echo "| Python dependencies | $PYTHON_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend dependencies | $FRONTEND_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker image layers | $DOCKER_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "SBOM artifacts uploaded." >> $GITHUB_STEP_SUMMARY
