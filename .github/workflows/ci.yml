name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for gitleaks

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Python dependency audit
        run: |
          uv pip install pip-audit --system
          uv export --no-hashes > requirements.txt
          pip-audit -r requirements.txt --ignore-vuln GHSA-xxxx-xxxx-xxxx || true

      - name: Check for hardcoded secrets in code
        run: |
          # Fail if any obvious secret patterns are found
          if grep -rE "(sk-[a-zA-Z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[a-zA-Z0-9]{36})" --include="*.py" --include="*.ts" --include="*.tsx" --include="*.yaml" app frontend/src; then
            echo "::error::Potential hardcoded secrets found!"
            exit 1
          fi
          echo "No hardcoded secrets detected"

  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    needs: security  # Run after security scan passes
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check app tests evals
      - name: Mypy
        run: uv run mypy app
      - name: Pytest
        run: uv run pytest -q
      - name: Prompt-injection red-team gate
        # Scores the guardrails against an adversarial corpus (offline, no API key).
        # Fails CI if injection detection regresses or benign telemetry is flagged.
        run: uv run python -m evals.run_redteam
      - name: Golden-trajectory replay gate
        # Replays recorded incident cassettes offline (no API key). No-op until a
        # cassette is recorded (evals/cassettes/golden.json); fails on a regression.
        run: |
          if [ -f evals/cassettes/golden.json ]; then
            uv run python -m evals.run_golden
          else
            echo "no golden cassette yet — skipping (record with: uv run python -m evals.run_golden --record)"
          fi

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint        # ESLint (typescript-eslint + react-hooks)
      - run: npm run typecheck   # full tsc (--force) — fails CI on any type error
      - run: npm run test        # Vitest unit tests
      - run: npm run build
