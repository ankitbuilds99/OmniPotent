name: Load Tests

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/load/**'
  pull_request:
    paths:
      - 'app/**'
      - 'tests/load/**'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Test duration (e.g., 30s, 1m, 5m)'
        default: '1m'
      vus:
        description: 'Virtual users'
        default: '50'
      target_env:
        description: 'Target environment'
        type: choice
        default: 'local'
        options:
          - local
          - staging
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM UTC

permissions:
  contents: read
  pull-requests: write

env:
  K6_VERSION: '0.49.0'

jobs:
  # ============================================================================
  # SMOKE TEST (Quick sanity check)
  # ============================================================================
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Start application
        run: |
          uv sync --extra dev
          uv run uvicorn app.api.main:app --host 0.0.0.0 --port 8000 &
          echo "APP_PID=$!" >> "$GITHUB_ENV"
          sleep 10
        env:
          REDIS_URL: redis://localhost:6379

      - name: Install k6
        run: |
          curl -fsSL https://github.com/grafana/k6/releases/download/v${{ env.K6_VERSION }}/k6-v${{ env.K6_VERSION }}-linux-amd64.tar.gz | tar xzf -
          sudo mv k6-v${{ env.K6_VERSION }}-linux-amd64/k6 /usr/local/bin/

      - name: Run smoke test
        run: |
          k6 run --out json=smoke-results.json tests/load/smoke.js
        env:
          K6_BASE_URL: http://localhost:8000

      - name: Stop application
        if: always()
        run: ./scripts/ci-stop-app.sh

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-results
          path: smoke-results.json

  # ============================================================================
  # LOAD TEST (Standard load)
  # ============================================================================
  load-test:
    name: Load Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: smoke-test

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omnipotent
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: omnipotent_test
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run migrations
        run: |
          uv sync --extra dev --extra migrations
          uv run alembic upgrade head
        env:
          COPILOT_DATABASE_URL: postgresql://omnipotent:test_password@localhost:5432/omnipotent_test

      - name: Start application
        run: |
          uv run uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --workers 4 &
          echo "APP_PID=$!" >> "$GITHUB_ENV"
          sleep 15
        env:
          REDIS_URL: redis://localhost:6379
          COPILOT_DATABASE_URL: postgresql://omnipotent:test_password@localhost:5432/omnipotent_test

      - name: Install k6
        run: |
          curl -fsSL https://github.com/grafana/k6/releases/download/v${{ env.K6_VERSION }}/k6-v${{ env.K6_VERSION }}-linux-amd64.tar.gz | tar xzf -
          sudo mv k6-v${{ env.K6_VERSION }}-linux-amd64/k6 /usr/local/bin/

      - name: Run load test
        run: |
          k6 run \
            --out json=load-results.json \
            --summary-export=load-summary.json \
            tests/load/load.js
        env:
          K6_BASE_URL: http://localhost:8000
          K6_VUS: ${{ github.event.inputs.vus || '50' }}
          K6_DURATION: ${{ github.event.inputs.duration || '1m' }}

      - name: Stop application
        if: always()
        run: ./scripts/ci-stop-app.sh

      - name: Parse results
        id: results
        run: |
          # Extract key metrics
          P95=$(jq '.metrics.http_req_duration.values.p95 // 0' load-summary.json)
          P99=$(jq '.metrics.http_req_duration.values.p99 // 0' load-summary.json)
          ERROR_RATE=$(jq '.metrics.http_req_failed.values.rate // 0' load-summary.json)
          RPS=$(jq '.metrics.http_reqs.values.rate // 0' load-summary.json)

          echo "p95=${P95}" >> $GITHUB_OUTPUT
          echo "p99=${P99}" >> $GITHUB_OUTPUT
          echo "error_rate=${ERROR_RATE}" >> $GITHUB_OUTPUT
          echo "rps=${RPS}" >> $GITHUB_OUTPUT

          # Check thresholds
          if (( $(echo "$P95 > 2000" | bc -l) )); then
            echo "::warning::P95 latency (${P95}ms) exceeds 2000ms threshold"
          fi
          if (( $(echo "$ERROR_RATE > 0.01" | bc -l) )); then
            echo "::error::Error rate (${ERROR_RATE}) exceeds 1% threshold"
            exit 1
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-results
          path: |
            load-results.json
            load-summary.json

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const p95 = '${{ steps.results.outputs.p95 }}';
            const p99 = '${{ steps.results.outputs.p99 }}';
            const errorRate = '${{ steps.results.outputs.error_rate }}';
            const rps = '${{ steps.results.outputs.rps }}';

            const body = `## Load Test Results

            | Metric | Value |
            |--------|-------|
            | P95 Latency | ${parseFloat(p95).toFixed(2)}ms |
            | P99 Latency | ${parseFloat(p99).toFixed(2)}ms |
            | Error Rate | ${(parseFloat(errorRate) * 100).toFixed(2)}% |
            | Requests/sec | ${parseFloat(rps).toFixed(2)} |

            ${parseFloat(p95) > 2000 ? '⚠️ P95 latency exceeds 2000ms threshold' : '✅ P95 latency within threshold'}
            ${parseFloat(errorRate) > 0.01 ? '❌ Error rate exceeds 1% threshold' : '✅ Error rate within threshold'}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # ============================================================================
  # STRESS TEST (Find breaking point)
  # ============================================================================
  stress-test:
    name: Stress Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: load-test

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omnipotent
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: omnipotent_test
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run migrations
        run: |
          uv sync --extra dev --extra migrations
          uv run alembic upgrade head
        env:
          COPILOT_DATABASE_URL: postgresql://omnipotent:test_password@localhost:5432/omnipotent_test

      - name: Start application
        run: |
          uv run uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --workers 4 &
          echo "APP_PID=$!" >> "$GITHUB_ENV"
          sleep 15
        env:
          REDIS_URL: redis://localhost:6379
          COPILOT_DATABASE_URL: postgresql://omnipotent:test_password@localhost:5432/omnipotent_test

      - name: Install k6
        run: |
          curl -fsSL https://github.com/grafana/k6/releases/download/v${{ env.K6_VERSION }}/k6-v${{ env.K6_VERSION }}-linux-amd64.tar.gz | tar xzf -
          sudo mv k6-v${{ env.K6_VERSION }}-linux-amd64/k6 /usr/local/bin/

      - name: Run stress test
        run: |
          k6 run \
            --out json=stress-results.json \
            --summary-export=stress-summary.json \
            tests/load/stress.js
        env:
          K6_BASE_URL: http://localhost:8000
        continue-on-error: true

      - name: Stop application
        if: always()
        run: ./scripts/ci-stop-app.sh

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-test-results
          path: |
            stress-results.json
            stress-summary.json

  # ============================================================================
  # SOAK TEST (Long running stability)
  # ============================================================================
  soak-test:
    name: Soak Test (Weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event.schedule == '0 2 * * 1'

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omnipotent
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: omnipotent_test
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run migrations
        run: |
          uv sync --extra dev --extra migrations
          uv run alembic upgrade head
        env:
          COPILOT_DATABASE_URL: postgresql://omnipotent:test_password@localhost:5432/omnipotent_test

      - name: Start application
        run: |
          uv run uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --workers 4 &
          echo "APP_PID=$!" >> "$GITHUB_ENV"
          sleep 15
        env:
          REDIS_URL: redis://localhost:6379
          COPILOT_DATABASE_URL: postgresql://omnipotent:test_password@localhost:5432/omnipotent_test

      - name: Install k6
        run: |
          curl -fsSL https://github.com/grafana/k6/releases/download/v${{ env.K6_VERSION }}/k6-v${{ env.K6_VERSION }}-linux-amd64.tar.gz | tar xzf -
          sudo mv k6-v${{ env.K6_VERSION }}-linux-amd64/k6 /usr/local/bin/

      - name: Run soak test (1 hour)
        run: |
          k6 run \
            --out json=soak-results.json \
            --summary-export=soak-summary.json \
            tests/load/soak.js
        env:
          K6_BASE_URL: http://localhost:8000
          K6_DURATION: '1h'
          K6_VUS: '20'

      - name: Stop application
        if: always()
        run: ./scripts/ci-stop-app.sh

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-test-results
          path: |
            soak-results.json
            soak-summary.json

      - name: Notify Slack
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "⚠️ Weekly soak test failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Weekly Soak Test Failed*\nThe 1-hour soak test found stability issues.\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Results>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
