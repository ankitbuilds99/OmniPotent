# Render Blueprint - DevOps Copilot
# https://render.com/docs/blueprint-spec

services:
  # Main application (Backend + Frontend)
  - type: web
    name: omnipotent
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      # LLM Provider - Choose one: anthropic, groq, openai, gemini, deepseek
      - key: COPILOT_PROVIDER
        value: groq  # Default to Groq (free tier available)

      # API Keys - Set the one matching your provider
      - key: GROQ_API_KEY
        sync: false  # Get free key at https://console.groq.com/keys
      - key: ANTHROPIC_API_KEY
        sync: false  # Optional: for Anthropic Claude
      - key: OPENAI_API_KEY
        sync: false  # Optional: for OpenAI GPT-4
      - key: GEMINI_API_KEY
        sync: false  # Optional: for Google Gemini
      - key: DEEPSEEK_API_KEY
        sync: false  # Optional: for DeepSeek

      # Production settings
      - key: COPILOT_ENV
        value: production
      - key: COPILOT_API_TOKEN
        generateValue: true  # Auto-generate secure token
      # Required in production (the app refuses to start without it): signs
      # session tokens and encrypts stored secrets. NOT generateValue — it must
      # be a Fernet key, and rotating it makes everything already encrypted
      # unreadable. Generate once and paste it in:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: COPILOT_SECRET_KEY
        sync: false

      # Database — the managed Postgres below is the ONLY durable store on Render.
      # Both names must be set: COPILOT_DATABASE_URL is the app/alembic database,
      # COPILOT_CHECKPOINT_DB is LangGraph's resumable state. With only the
      # checkpoint URL wired, the app fell back to SQLite on the container's
      # ephemeral filesystem and lost every row on each redeploy.
      - key: COPILOT_DATABASE_URL
        fromDatabase:
          name: copilot-db
          property: connectionString
      - key: COPILOT_CHECKPOINT_DB
        fromDatabase:
          name: copilot-db
          property: connectionString

      # Local scratch state (vector index, caches). The free plan has NO
      # persistent disk — Render disks require a paid instance type — so this
      # directory is wiped on every deploy and restart. It is set explicitly only
      # so writes land in the image's writable dir rather than wherever the
      # process happened to start; anything that must survive belongs in the
      # Postgres URLs above. Add a Render Key Value (Redis) service and set
      # COPILOT_REDIS_URL before scaling past one instance: without it the rate
      # limiter, cache and spend caps are per-process.
      - key: COPILOT_STATE_DIR
        value: /app/data

      # GitHub integration (set these for live GitHub mode)
      - key: GITHUB_TOKEN
        sync: false  # Your GitHub Personal Access Token with 'repo' scope
      - key: GITHUB_REPO
        sync: false  # Repository as 'owner/repo' (e.g., 'facebook/react')

      # Supabase Database & Auth
      - key: SUPABASE_URL
        sync: false  # Your Supabase project URL
      - key: SUPABASE_ANON_KEY
        sync: false  # Supabase anon/public key
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false  # Supabase service role key (for admin operations)
      - key: SUPABASE_JWKS_URL
        sync: false  # https://your-project.supabase.co/auth/v1/.well-known/jwks.json
      - key: SUPABASE_DATABASE_URL
        sync: false  # Direct PostgreSQL connection string

      # Frontend Supabase (passed to Vite build)
      - key: VITE_SUPABASE_URL
        sync: false  # Same as SUPABASE_URL
      - key: VITE_SUPABASE_ANON_KEY
        sync: false  # Same as SUPABASE_ANON_KEY

      # OAuth Providers (alternative to Supabase Auth)
      - key: GOOGLE_CLIENT_ID
        sync: false  # Google OAuth Client ID
      - key: GOOGLE_CLIENT_SECRET
        sync: false  # Google OAuth Client Secret
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false  # GitHub OAuth Client ID
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false  # GitHub OAuth Client Secret

      # Defaults
      - key: TARGET_REPO_PATH
        value: ./sample_repo
      - key: COPILOT_MAX_ITERATIONS
        value: "8"
      - key: COPILOT_VERIFY_FIX
        value: "true"
      - key: COPILOT_LEARN_INCIDENTS
        value: "true"
      - key: LOG_FORMAT
        value: json

  # Alternative: Separate backend and frontend
  # Uncomment below if you want to deploy separately

  # - type: web
  #   name: omnipotent-api
  #   runtime: python
  #   buildCommand: pip install -e .
  #   startCommand: uvicorn app.api.main:app --host 0.0.0.0 --port $PORT
  #   plan: free
  #   healthCheckPath: /healthz
  #   envVars:
  #     - key: COPILOT_PROVIDER
  #       value: anthropic
  #     - key: ANTHROPIC_API_KEY
  #       sync: false

  # - type: web
  #   name: omnipotent-web
  #   runtime: static
  #   buildCommand: cd frontend && npm install && npm run build
  #   staticPublishPath: ./frontend/dist
  #   plan: free
  #   routes:
  #     - type: rewrite
  #       source: /*
  #       destination: /index.html

databases:
  - name: copilot-db
    plan: free
    databaseName: copilot
    user: copilot
