  #       sync: false

  # - type: web
  #   name: devops-copilot-web
  #   runtime: static
  #   buildCommand: cd frontend && npm install && npm run build
  #   staticPublishPath: ./frontend/dist
  #   plan: free
  #   routes:
  #     - type: rewrite
  #       source: /*
  #       destination: /index.html

databases:
  - name: copilot-db
    plan: free
    databaseName: copilot
    user: copilot
